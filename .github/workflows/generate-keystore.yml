name: Generate Android Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Key alias
        required: true
        default: medjool
      password:
        description: Keystore/key password (use a temporary password; this workflow does not persist it)
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate keystore
        env:
          KEY_PASSWORD: ${{ inputs.password }}
          KEY_ALIAS: ${{ inputs.alias }}
        run: |
          mkdir -p artifacts
          keytool -genkeypair \
            -v \
            -keystore artifacts/medjool-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Medjool Farm Manager, OU=Software, O=Medjool Farm Manager, L=Luxor, ST=Luxor, C=EG"

      - name: Upload keystore as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: medjool-release-keystore
          path: artifacts/medjool-release.keystore
          retention-days: 1
